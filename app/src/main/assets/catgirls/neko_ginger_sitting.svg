<?xml version="1.0" encoding="UTF-8"?>
<!-- Nekomimi pack: a ginger catgirl sitting on the plank's edge, legs and tail
     hanging over the front. Drawn for Bookshelf. -->
<!-- bookshelf:overhang=18 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 106">
  <g stroke="#2a1a12" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail hanging over the edge -->
    <path d="M46 86 C52 90 52 98 47 101 C44 103 44 106 47 105" fill="none" stroke="#2a1a12" stroke-width="5.6"/>
    <path d="M46 86 C52 90 52 98 47 101 C44 103 44 106 47 105" fill="none" stroke="#c9732f" stroke-width="3.4"/>
    <!-- back hair -->
    <path d="M14 36 C12 50 14 60 19 66 L45 66 C50 60 52 50 50 36 Z" fill="#c9732f"/>
    <!-- dangling legs (over the plank front) -->
    <path d="M24 86 L23 100" fill="none" stroke="#2a1a12" stroke-width="5.4"/>
    <path d="M24 86 L23 100" fill="none" stroke="#f3efe8" stroke-width="3.2"/>
    <path d="M38 86 L41 99" fill="none" stroke="#2a1a12" stroke-width="5.4"/>
    <path d="M38 86 L41 99" fill="none" stroke="#f3efe8" stroke-width="3.2"/>
    <ellipse cx="22.5" cy="102" rx="3.6" ry="2.4" fill="#4a2c1c"/>
    <ellipse cx="42" cy="101" rx="3.6" ry="2.4" fill="#4a2c1c" transform="rotate(-18 42 101)"/>
    <!-- skirt spread on the plank -->
    <path d="M22 70 H42 L52 86 C46 90 18 90 12 86 Z" fill="#35603e"/>
    <path d="M14 85 C22 88 42 88 50 85" fill="none" stroke="#f3efe8" stroke-width="1"/>
    <!-- top -->
    <path d="M24 53 H40 L42 72 H22 Z" fill="#f3efe8"/>
    <path d="M32 56 L27 53.5 L27 59 Z M32 56 L37 53.5 L37 59 Z" fill="#35603e"/>
    <!-- arms resting on the lap -->
    <path d="M24 57 C19 63 20 70 26 73" fill="none" stroke="#2a1a12" stroke-width="4.6"/>
    <path d="M24 57 C19 63 20 70 26 73" fill="none" stroke="#f3efe8" stroke-width="2.6"/>
    <path d="M40 57 C45 63 44 70 38 73" fill="none" stroke="#2a1a12" stroke-width="4.6"/>
    <path d="M40 57 C45 63 44 70 38 73" fill="none" stroke="#f3efe8" stroke-width="2.6"/>
    <ellipse cx="28" cy="73.5" rx="3" ry="2.6" fill="#f8dcc4"/>
    <ellipse cx="36" cy="73.5" rx="3" ry="2.6" fill="#f8dcc4"/>
    <!-- ears -->
    <path d="M15 30 L13 9 L28 20 Z" fill="#c9732f"/>
    <path d="M49 30 L51 9 L36 20 Z" fill="#c9732f"/>
    <path d="M17.5 25 L16 14 L24 20.5 Z" fill="#f2c9a0" stroke-width="0.8"/>
    <path d="M46.5 25 L48 14 L40 20.5 Z" fill="#f2c9a0" stroke-width="0.8"/>
    <!-- face -->
    <ellipse cx="32" cy="38" rx="16" ry="15" fill="#f8dcc4"/>
    <!-- bangs: soft, swept to one side -->
    <path d="M14 39 C12 24 21 15 32 15 C43 15 52 24 50 39 C48 33 45 30 42 29 Q41 33 37.5 35 Q38 30 35 27 Q31 32 26 33 Q28 30 28 27 Q23 30 21 34 Q19 33 18.5 31 C16.5 33 15 36 14 39 Z" fill="#c9732f"/>
    <path d="M18 34 C16 44 17 52 20 57 C21 50 21 42 21 36 Z" fill="#c9732f"/>
    <path d="M46 34 C48 44 47 52 44 57 C43 50 43 42 43 36 Z" fill="#c9732f"/>
    <!-- hair clip -->
    <path d="M41 20 L45 18 L46 22 L42 24 Z" fill="#35603e" stroke-width="0.9"/>
    <!-- happy closed eyes -->
    <path d="M22 41 Q25.5 36.5 29 41" fill="none" stroke="#2a1a12" stroke-width="1.8"/>
    <path d="M35 41 Q38.5 36.5 42 41" fill="none" stroke="#2a1a12" stroke-width="1.8"/>
    <!-- blush -->
    <ellipse cx="21.5" cy="45.5" rx="2.8" ry="1.3" fill="#ee9fa4" stroke="none"/>
    <ellipse cx="42.5" cy="45.5" rx="2.8" ry="1.3" fill="#ee9fa4" stroke="none"/>
    <!-- open smile -->
    <path d="M29 46 Q32 51 35 46 Z" fill="#a33a3a" stroke-width="0.9"/>
  </g>
</svg>
