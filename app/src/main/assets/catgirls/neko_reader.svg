<?xml version="1.0" encoding="UTF-8"?>
<!-- Nekomimi pack: a chibi catgirl hugging a book. Drawn for Bookshelf. -->
<!-- bookshelf:overhang=0 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 106">
  <g stroke="#24182c" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail, behind everything -->
    <path d="M42 84 C54 84 60 74 56 62 C54 56 50 56 50 60" fill="none" stroke="#24182c" stroke-width="5.6"/>
    <path d="M42 84 C54 84 60 74 56 62 C54 56 50 56 50 60" fill="none" stroke="#4a3358" stroke-width="3.4"/>
    <!-- back hair -->
    <path d="M13 36 C11 52 13 62 18 68 L46 68 C51 62 53 52 51 36 Z" fill="#4a3358"/>
    <!-- legs, socks, shoes -->
    <rect x="25" y="84" width="5" height="12" rx="1.5" fill="#2e2a3a"/>
    <rect x="34" y="84" width="5" height="12" rx="1.5" fill="#2e2a3a"/>
    <ellipse cx="27" cy="97.5" rx="4.2" ry="2.4" fill="#3a2418"/>
    <ellipse cx="37" cy="97.5" rx="4.2" ry="2.4" fill="#3a2418"/>
    <!-- dress -->
    <path d="M25 54 H39 L47 86 C40 89 24 89 17 86 Z" fill="#2c4a78"/>
    <!-- apron -->
    <path d="M27 60 H37 L41 84 C36 86 28 86 23 84 Z" fill="#f3efe8"/>
    <!-- collar + bow -->
    <path d="M24 54 L32 60 L40 54 L36 52 H28 Z" fill="#f3efe8"/>
    <path d="M32 58 L27 55 L27 61 Z M32 58 L37 55 L37 61 Z" fill="#c23b3b"/>
    <!-- the book, held in front -->
    <path d="M21 64 L32 67 L43 64 L43 77 L32 80 L21 77 Z" fill="#8a2f2f"/>
    <path d="M32 67 V80" fill="none"/>
    <path d="M23 66 L31 68.3 M23 69 L31 71.3 M33 68.3 L41 66 M33 71.3 L41 69" fill="none" stroke="#e9d9b8" stroke-width="0.9"/>
    <!-- hands over the book edge -->
    <ellipse cx="22.5" cy="70" rx="3" ry="3.3" fill="#f6d2b6"/>
    <ellipse cx="41.5" cy="70" rx="3" ry="3.3" fill="#f6d2b6"/>
    <!-- ears -->
    <path d="M14 30 L13 9 L28 20 Z" fill="#4a3358"/>
    <path d="M50 30 L51 9 L36 20 Z" fill="#4a3358"/>
    <path d="M16.5 25 L16 14 L24 20.5 Z" fill="#e7a2ae" stroke-width="0.8"/>
    <path d="M47.5 25 L48 14 L40 20.5 Z" fill="#e7a2ae" stroke-width="0.8"/>
    <!-- face -->
    <ellipse cx="32" cy="38" rx="16" ry="15" fill="#f8dcc4"/>
    <!-- bangs -->
    <path d="M14 39 C12 24 21 15 32 15 C43 15 52 24 50 39 C48 34 46 31 44 30 Q43 34 40.5 36 Q41 31 38 28 Q36 33 32 35 Q28 33 26 28 Q23 31 23.5 36 Q21 34 20 30 C18 32 15.5 35 14 39 Z" fill="#4a3358"/>
    <path d="M31 15 C29 10 32 7 36 8 C33 9 32 12 33 15 Z" fill="#4a3358"/>
    <!-- side locks -->
    <path d="M15 36 C14 44 15 50 18 55 C19 48 19 42 19 37 Z" fill="#4a3358"/>
    <path d="M49 36 C50 44 49 50 46 55 C45 48 45 42 45 37 Z" fill="#4a3358"/>
    <!-- eyes -->
    <ellipse cx="25.5" cy="40" rx="3.4" ry="4.4" fill="#2a1d3a"/>
    <ellipse cx="38.5" cy="40" rx="3.4" ry="4.4" fill="#2a1d3a"/>
    <ellipse cx="25.5" cy="42.2" rx="2.3" ry="1.9" fill="#7d62ad" stroke="none"/>
    <ellipse cx="38.5" cy="42.2" rx="2.3" ry="1.9" fill="#7d62ad" stroke="none"/>
    <circle cx="24.3" cy="38.3" r="1.3" fill="#ffffff" stroke="none"/>
    <circle cx="37.3" cy="38.3" r="1.3" fill="#ffffff" stroke="none"/>
    <circle cx="26.6" cy="42" r="0.6" fill="#ffffff" stroke="none"/>
    <circle cx="39.6" cy="42" r="0.6" fill="#ffffff" stroke="none"/>
    <!-- blush -->
    <ellipse cx="21.5" cy="46" rx="2.6" ry="1.2" fill="#ee9fa4" stroke="none"/>
    <ellipse cx="42.5" cy="46" rx="2.6" ry="1.2" fill="#ee9fa4" stroke="none"/>
    <!-- cat mouth -->
    <path d="M29.6 46.3 Q30.8 47.8 32 46.3 Q33.2 47.8 34.4 46.3" fill="none" stroke-width="0.9"/>
  </g>
</svg>
