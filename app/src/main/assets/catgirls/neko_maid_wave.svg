<?xml version="1.0" encoding="UTF-8"?>
<!-- Nekomimi pack: a black-haired maid catgirl waving a paw. Drawn for Bookshelf. -->
<!-- bookshelf:overhang=0 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 106">
  <g stroke="#14111a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M22 82 C10 82 6 72 10 62 C12 57 16 58 15 62" fill="none" stroke="#14111a" stroke-width="5.6"/>
    <path d="M22 82 C10 82 6 72 10 62 C12 57 16 58 15 62" fill="none" stroke="#26222e" stroke-width="3.4"/>
    <!-- back hair: long twin tails -->
    <path d="M14 34 C8 46 8 60 12 72 C15 66 16 54 18 44 Z" fill="#26222e"/>
    <path d="M50 34 C56 46 56 60 52 72 C49 66 48 54 46 44 Z" fill="#26222e"/>
    <path d="M15 36 C13 50 15 58 20 64 L44 64 C49 58 51 50 49 36 Z" fill="#26222e"/>
    <!-- legs -->
    <rect x="25" y="85" width="5" height="11" rx="1.5" fill="#f3efe8"/>
    <rect x="34" y="85" width="5" height="11" rx="1.5" fill="#f3efe8"/>
    <ellipse cx="27" cy="97.5" rx="4.2" ry="2.4" fill="#14111a"/>
    <ellipse cx="37" cy="97.5" rx="4.2" ry="2.4" fill="#14111a"/>
    <!-- maid dress -->
    <path d="M25 54 H39 L48 86 C40 89 24 89 16 86 Z" fill="#1c1a24"/>
    <!-- frilled apron -->
    <path d="M26 62 H38 L42 84 Q40 86.5 38 84.5 Q36 87 34 84.8 Q32 87.2 30 84.8 Q28 87 26 84.5 Q24 86.5 22 84 Z" fill="#f6f4ee"/>
    <path d="M26 62 Q32 66 38 62" fill="none"/>
    <!-- collar + ribbon -->
    <path d="M24 54 L32 59 L40 54 L36 52 H28 Z" fill="#f6f4ee"/>
    <path d="M32 57.5 L27.5 55 L27.5 60.5 Z M32 57.5 L36.5 55 L36.5 60.5 Z" fill="#b8323a"/>
    <!-- left arm down -->
    <path d="M25 58 C21 64 20 70 21 74" fill="none" stroke="#14111a" stroke-width="4.6"/>
    <path d="M25 58 C21 64 20 70 21 74" fill="none" stroke="#1c1a24" stroke-width="2.6"/>
    <ellipse cx="21.2" cy="75.5" rx="2.6" ry="2.6" fill="#f8dcc4"/>
    <!-- right arm raised, waving a paw -->
    <path d="M39 58 C45 56 48 50 49 45" fill="none" stroke="#14111a" stroke-width="4.6"/>
    <path d="M39 58 C45 56 48 50 49 45" fill="none" stroke="#1c1a24" stroke-width="2.6"/>
    <path d="M45.5 44 C45 39 47 36.5 49.5 36.5 C52 36.5 54 39 53.5 44 C52.5 46 46.5 46 45.5 44 Z" fill="#f8dcc4"/>
    <path d="M47.5 37.5 V40 M49.5 36.8 V39.6 M51.5 37.5 V40" fill="none" stroke-width="0.8"/>
    <!-- motion lines -->
    <path d="M56 36 Q58 40 56 44 M58.5 34 Q61.5 40 58.5 46" fill="none" stroke-width="1"/>
    <!-- ears -->
    <path d="M14 30 L13 9 L28 20 Z" fill="#26222e"/>
    <path d="M50 30 L51 9 L36 20 Z" fill="#26222e"/>
    <path d="M16.5 25 L16 14 L24 20.5 Z" fill="#e7a2ae" stroke-width="0.8"/>
    <path d="M47.5 25 L48 14 L40 20.5 Z" fill="#e7a2ae" stroke-width="0.8"/>
    <!-- face -->
    <ellipse cx="32" cy="38" rx="16" ry="15" fill="#f8dcc4"/>
    <!-- straight bangs (hime cut) -->
    <path d="M14 39 C12 24 21 15 32 15 C43 15 52 24 50 39 L47 32 L44 34 L42 29 L38 33 L35 28 L32 33 L29 28 L26 33 L22 29 L20 34 L17 32 Z" fill="#26222e"/>
    <!-- maid headband -->
    <path d="M18 22 Q32 12 46 22 L44 25 Q32 17 20 25 Z" fill="#f6f4ee"/>
    <path d="M22 21 Q24 17 27 19 M29 17 Q32 13.5 35 17 M37 19 Q40 17 42 21" fill="none" stroke-width="0.9"/>
    <!-- eyes: one open, one winking -->
    <ellipse cx="25.5" cy="40" rx="3.4" ry="4.4" fill="#14111a"/>
    <ellipse cx="25.5" cy="42.2" rx="2.3" ry="1.9" fill="#b8323a" stroke="none"/>
    <circle cx="24.3" cy="38.3" r="1.3" fill="#ffffff" stroke="none"/>
    <circle cx="26.6" cy="42" r="0.6" fill="#ffffff" stroke="none"/>
    <path d="M35 40.5 Q38.5 37 42 40.5" fill="none" stroke-width="1.8"/>
    <!-- blush -->
    <ellipse cx="21.5" cy="46" rx="2.6" ry="1.2" fill="#ee9fa4" stroke="none"/>
    <ellipse cx="42.5" cy="46" rx="2.6" ry="1.2" fill="#ee9fa4" stroke="none"/>
    <!-- cat mouth with a fang -->
    <path d="M29.6 46.3 Q30.8 47.8 32 46.3 Q33.2 47.8 34.4 46.3" fill="none" stroke-width="0.9"/>
    <path d="M30.4 47 L31 48.6 L31.6 47.2 Z" fill="#ffffff" stroke-width="0.5"/>
  </g>
</svg>
